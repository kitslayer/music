name: Build iOS app

# Produces an UNSIGNED .ipa. It is re-signed on-device by xtool with a free
# Apple developer certificate, which is why nothing here needs secrets.
#
# There is no macOS available locally, so this workflow is the compiler: a red
# run here is the only signal that the Swift does not build.

on:
    workflow_dispatch:
    push:
        branches: [main, development]

permissions:
    contents: write

jobs:
    build:
        runs-on: macos-26
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v5

            - name: Show toolchain
              run: |
                  xcodebuild -version
                  swift --version

            - name: Archive (ad-hoc signed)
              run: |
                  # Ad-hoc rather than unsigned: a binary with no
                  # LC_CODE_SIGNATURE at all cannot be reliably re-signed later,
                  # and iOS then refuses to launch it ("Bootstrap failed").
                  xcodebuild \
                    -project Music.xcodeproj \
                    -scheme Music \
                    -configuration Release \
                    -sdk iphoneos \
                    -destination 'generic/platform=iOS' \
                    -archivePath "$RUNNER_TEMP/Music.xcarchive" \
                    archive \
                    CODE_SIGNING_ALLOWED=YES \
                    AD_HOC_CODE_SIGNING_ALLOWED=YES \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY="-" \
                    CODE_SIGN_STYLE=Manual \
                    DEVELOPMENT_TEAM=""

            - name: Package .ipa
              run: |
                  APP="$RUNNER_TEMP/Music.xcarchive/Products/Applications/Music.app"
                  test -d "$APP" || { echo "no .app produced"; exit 1; }
                  mkdir -p "$RUNNER_TEMP/Payload"
                  cp -R "$APP" "$RUNNER_TEMP/Payload/"
                  cd "$RUNNER_TEMP"
                  zip -qry Music-unsigned.ipa Payload
                  ls -lh Music-unsigned.ipa

            - uses: actions/upload-artifact@v4
              with:
                  name: Music-unsigned-ipa
                  path: ${{ runner.temp }}/Music-unsigned.ipa
                  if-no-files-found: error

            # Also published to a rolling prerelease, for two reasons: the artifact
            # API has gone down mid-install before, and a release asset has a stable
            # URL, so the weekly re-sign is always `gh release download latest`
            # rather than looking up a run id.
            - name: Publish to the rolling 'latest' release
              if: github.ref == 'refs/heads/main'
              # Never fails the run. This workflow's real job is to tell me whether
              # the Swift compiles; a GitHub upload outage must not turn that signal
              # red, because then a genuine compile error is indistinguishable.
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  cp "$RUNNER_TEMP/Music-unsigned.ipa" "$RUNNER_TEMP/Music.ipa"
                  # Notes built in a variable: a literal newline inside the YAML
                  # block scalar has to stay indented, and an unindented
                  # continuation line silently invalidates the whole workflow.
                  printf 'Ad-hoc signed. Install with `xtool install Music.ipa`.\n\nCommit %s\n' \
                    "${GITHUB_SHA:0:7}" > "$RUNNER_TEMP/notes.md"
                  gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

                  # Retried: the asset upload endpoint returns 503 during GitHub
                  # incidents, and a half-created release with no .ipa is worse than
                  # none at all.
                  for attempt in 1 2 3 4 5; do
                    if gh release create latest \
                      "$RUNNER_TEMP/Music.ipa" \
                      --repo "$GITHUB_REPOSITORY" \
                      --title "Latest build" \
                      --notes-file "$RUNNER_TEMP/notes.md" \
                      --prerelease; then
                      echo "published"
                      exit 0
                    fi
                    echo "attempt $attempt failed; cleaning up and retrying"
                    gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
                    sleep 20
                  done
                  echo "could not publish the release; the artifact is still attached to this run"
                  exit 1
